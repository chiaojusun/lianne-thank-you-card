<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You, Lianne</title>
    <meta
      name="description"
      content="A personal thank-you card from Kathy to Lianne."
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-label="Thank-you card for Lianne">
        <div class="twinkle-field" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="botanical botanical-left" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="botanical botanical-right" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <div class="card-stage" data-card-stage>
          <div class="sparkle sparkle-one" aria-hidden="true"></div>
          <div class="sparkle sparkle-two" aria-hidden="true"></div>
          <div class="sparkle sparkle-three" aria-hidden="true"></div>

          <div class="envelope-scene" aria-hidden="true">
            <div class="back-pocket"></div>

            <div class="leaf-spray leaf-spray-left">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="leaf-spray leaf-spray-right">
              <i></i><i></i><i></i><i></i><i></i>
            </div>
            <div class="flower flower-purple">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-blue">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-small">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-lavender">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-sky">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-coral">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-white">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>
            <div class="flower flower-violet-small">
              <i></i><i></i><i></i><i></i><i></i><i></i><b></b>
            </div>

            <div class="folded-note" aria-hidden="true">
              <span>Dear Lianne</span>
            </div>

            <div class="main-card">
              <p>Thank</p>
              <p>You</p>
            </div>

            <div class="gift-peek">
              <span>A small</span>
              <span>gift for you</span>
            </div>

            <div class="envelope-body">
              <div class="envelope-left"></div>
              <div class="envelope-right"></div>
              <div class="envelope-front">
                <span>To Lianne</span>
              </div>
            </div>
          </div>

          <button class="open-button" type="button" data-open-card>
            Open the card
          </button>
          <p class="made-by">Made with love by Kathy.</p>

          <article
            class="unfolded-letter"
            aria-labelledby="letter-title"
            aria-hidden="true"
            inert
          >
            <div class="paper-fold fold-top" aria-hidden="true"></div>
            <div class="paper-fold fold-bottom" aria-hidden="true"></div>
            <button
              class="letter-close"
              type="button"
              aria-label="Close letter"
              data-close-letter
            >
              ×
            </button>

            <h2 id="letter-title" class="sr-only">Dear Lianne,</h2>

            <div class="handwritten-wrap">
              <img
                src="./assets/handwritten-letter.jpg"
                alt="A handwritten thank-you letter from Kathy to Lianne."
              />
            </div>

            <div class="inline-gift" aria-labelledby="gift-title">
              <div class="gift-icon" aria-hidden="true">
                <span></span>
              </div>
              <div>
                <p class="gift-kicker">Amazon gift card</p>
                <h2 id="gift-title">An Amazon gift card for you</h2>
                <p class="gift-copy">
                  I included it in this email as a small thank-you for all the
                  wonderful lessons and conversations.
                </p>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
